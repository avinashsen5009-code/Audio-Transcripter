<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio to word timestamps</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#17202b;--mute:#5d6b7a;--line:#d5dce4;--accent:#1f5eff;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10151b;--panel:#171e26;--ink:#e6ebf0;--mute:#93a1b0;--line:#2a3441;--accent:#6a97ff;--accent-ink:#0b1220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 24px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.row label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:4px;flex:1;min-width:200px}
select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
#drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:36px 16px;text-align:center;cursor:pointer;background:var(--panel)}
#drop.over,#drop:focus-within{border-color:var(--accent)}
#drop input{position:absolute;opacity:0;pointer-events:none}
#status{margin:16px 0 6px;color:var(--mute);min-height:1.5em}
progress{width:100%;height:8px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 8px}
button{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{margin:0 0 16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:420px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
h2{font-size:1rem;margin:20px 0 6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Audio to word timestamps</h1>
<p class="sub">Runs in your browser. Your audio is not uploaded anywhere. The first run downloads the model, then it is cached.</p>

<div class="row">
  <label>Model
    <select id="model">
      <option value="Xenova/whisper-small.en">English – small (best accuracy, ~250 MB)</option>
      <option value="Xenova/whisper-base.en">English – base (faster, ~80 MB)</option>
      <option value="Xenova/whisper-tiny.en">English – tiny (fastest, ~40 MB)</option>
      <option value="onnx-community/whisper-small_timestamped">Multilingual – small (~250 MB)</option>
      <option value="onnx-community/whisper-base_timestamped">Multilingual – base (~80 MB)</option>
    </select>
  </label>
  <label id="langWrap" hidden>Language
    <select id="lang">
      <option value="">Auto-detect</option>
      <option value="hindi">Hindi</option>
      <option value="english">English</option>
      <option value="spanish">Spanish</option>
      <option value="french">French</option>
      <option value="german">German</option>
      <option value="arabic">Arabic</option>
      <option value="bengali">Bengali</option>
      <option value="tamil">Tamil</option>
      <option value="urdu">Urdu</option>
    </select>
  </label>
</div>

<label id="drop" tabindex="-1">
  <input id="file" type="file" accept="audio/*,video/*">
  Drop an audio file here, or click to choose one
</label>

<div id="status" role="status"></div>
<progress id="bar" max="100" value="0" hidden></progress>

<section id="out" hidden>
  <div class="tools">
    <button class="primary" id="copyWords">Copy word timestamps</button>
    <button id="copyText">Copy plain text</button>
    <button id="dlSrt">Download .srt</button>
    <button id="dlJson">Download .json</button>
  </div>
  <h2>Word level</h2>
  <pre id="words"></pre>
  <h2>Plain text</h2>
  <pre id="plain"></pre>
</section>
</main>

<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1";

const $ = id => document.getElementById(id);
const modelSel = $("model"), langWrap = $("langWrap"), langSel = $("lang");
const statusEl = $("status"), bar = $("bar"), out = $("out");
let asr = null, loaded = null, result = [], fileName = "transcript";

const isMulti = () => !modelSel.value.endsWith(".en");
const syncLang = () => { langWrap.hidden = !isMulti(); };
modelSel.addEventListener("change", syncLang); syncLang();

const setStatus = t => { statusEl.textContent = t; };
const f2 = t => t.toFixed(2).padStart(5, "0");
const srtTime = t => {
  const ms = Math.round(t * 1000), h = Math.floor(ms / 3600000), m = Math.floor(ms % 3600000 / 60000),
        s = Math.floor(ms % 60000 / 1000), r = ms % 1000, p = (n, l = 2) => String(n).padStart(l, "0");
  return `${p(h)}:${p(m)}:${p(s)},${p(r, 3)}`;
};

async function getAsr(model) {
  if (asr && loaded === model) return asr;
  asr = null;
  setStatus("Downloading model (first time only)…");
  bar.hidden = false; bar.value = 0;
  asr = await pipeline("automatic-speech-recognition", model, {
    progress_callback: p => { if (p.status === "progress") bar.value = p.progress; }
  });
  loaded = model;
  return asr;
}

async function decode(file) {
  const buf = await file.arrayBuffer();
  const ctx = new AudioContext({ sampleRate: 16000 });
  const d = await ctx.decodeAudioData(buf);
  ctx.close();
  if (d.numberOfChannels === 1) return d.getChannelData(0);
  const mix = new Float32Array(d.length);
  for (let c = 0; c < d.numberOfChannels; c++) {
    const ch = d.getChannelData(c);
    for (let i = 0; i < d.length; i++) mix[i] += ch[i] / d.numberOfChannels;
  }
  return mix;
}

async function run(file) {
  out.hidden = true;
  fileName = file.name.replace(/\.[^.]+$/, "") || "transcript";
  try {
    const model = modelSel.value;
    const pipe = await getAsr(model);
    setStatus("Reading audio…"); bar.removeAttribute("value");
    const audio = await decode(file);
    const dur = audio.length / 16000;
    setStatus("Transcribing… this can take a while for long files.");
    const opts = { return_timestamps: "word", chunk_length_s: 30, stride_length_s: 5 };
    if (isMulti()) { opts.task = "transcribe"; if (langSel.value) opts.language = langSel.value; }
    const res = await pipe(audio, opts);
    result = (res.chunks || []).map(c => {
      const s = c.timestamp[0] ?? 0;
      const e = c.timestamp[1] ?? Math.min(dur, s + 0.3);
      return { word: c.text.trim(), start: s, end: e };
    }).filter(w => w.word);
    $("words").textContent = result.map(w => `[${f2(w.start)} - ${f2(w.end)}] ${w.word}`).join("\n");
    $("plain").textContent = result.map(w => w.word).join(" ");
    out.hidden = false; bar.hidden = true;
    setStatus(`Done. ${result.length} words, ${dur.toFixed(1)} s of audio.`);
  } catch (err) {
    console.error(err); bar.hidden = true;
    setStatus("Something went wrong: " + (err.message || err) + ". Try a smaller model or a different file format (WAV or MP3).");
  }
}

const copy = async (text, btn) => {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement("textarea"); t.value = text; document.body.append(t); t.select(); document.execCommand("copy"); t.remove(); }
  const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = old, 1200);
};
const save = (name, text, type) => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
};

$("copyWords").onclick = e => copy($("words").textContent, e.target);
$("copyText").onclick = e => copy($("plain").textContent, e.target);
$("dlJson").onclick = () => save(fileName + ".json", JSON.stringify(result, null, 2), "application/json");
$("dlSrt").onclick = () => {
  let n = 1, cue = [], srt = "";
  const flush = () => {
    if (!cue.length) return;
    srt += `${n++}\n${srtTime(cue[0].start)} --> ${srtTime(cue[cue.length - 1].end)}\n${cue.map(w => w.word).join(" ")}\n\n`;
    cue = [];
  };
  for (const w of result) { cue.push(w); if (cue.length >= 7 || /[.?!]$/.test(w.word)) flush(); }
  flush();
  save(fileName + ".srt", srt, "text/plain");
};

const drop = $("drop"), fileIn = $("file");
fileIn.addEventListener("change", () => fileIn.files[0] && run(fileIn.files[0]));
["dragover", "dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => { const f = e.dataTransfer.files[0]; if (f) run(f); });
</script>
</body>
</html>
